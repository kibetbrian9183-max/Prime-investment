<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Investment - Recharge</title>

    <link rel="stylesheet" href="css/recharge.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        .container{
            max-width:420px;
            margin:40px auto;
            background:#fff;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:20px;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:8px;
            background:#0d6efd;
            color:white;
            font-size:17px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#0953c6;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#0d6efd;
        }

        .note{
            margin-top:15px;
            text-align:center;
            color:#666;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Recharge Account</h2>

    <form id="rechargeForm">

        <div class="input-group">
            <label>Safaricom Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="2547XXXXXXXX"
                required>
        </div>

        <div class="input-group">
            <label>Recharge Amount (KSh)</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter Amount"
                min="1"
                required>
        </div>

        <button type="submit">
            Recharge via M-Pesa
        </button>

    </form>

    <p class="note">
        After tapping the button, an STK Push will be sent to your phone. Enter your M-Pesa PIN to complete payment.
    </p>

    <a href="profile.html" class="back">
        ← Back to Profile
    </a>

</div>

<script src="js/recharge.js"></script>

</body>
</html>
